name: my_stream_player
description: A personal Navidrome / Subsonic music player with adjustable lyric size and system-following light/dark theme.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  just_audio: ^0.9.38
  audio_service: ^0.18.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.3
  scrollable_positioned_list: ^0.3.8
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#4A7CF7"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/
