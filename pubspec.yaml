name: my_stream_player
description: A personal Navidrome / Subsonic music player with adjustable lyric size and system-following light/dark theme.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  crypto: ^3.0.3
  just_audio: ^0.9.38
  just_audio_background: any
  path_provider: ^2.1.0
  shared_preferences: ^2.2.3
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
