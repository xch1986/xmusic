name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: false

      - name: Generate Android project
        run: flutter create --platforms=android --project-name my_stream_player .

      - name: Patch app label and package id
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="音素"|' "$f"
          # Newer Flutter templates use build.gradle.kts, older use build.gradle.
          g=android/app/build.gradle
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId "com.xmusic.player"|' "$g"
          fi
          g=android/app/build.gradle.kts
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId = "com.xmusic.player"|' "$g"
          fi
          grep -n "android:label" "$f"
          grep -rn "applicationId" android/app/build.gradle* || true

      - name: Patch AndroidManifest (network + 车机媒体识别)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <application android:usesCleartextTraffic="true" android:requestLegacyExternalStorage="true"|' "$f"
          # 车机媒体识别：声明音乐应用 category + MUSIC_PLAYER action（迪友等车机桌面按此枚举音乐播放器）
          sed -i 's|<category android:name="android.intent.category.LAUNCHER"/>|<category android:name="android.intent.category.LAUNCHER"/>\n            <category android:name="android.intent.category.APP_MUSIC"/>\n            <category android:name="com.android.launcher.category.APP_MUSIC"/>\n            <action android:name="android.intent.action.MUSIC_PLAYER"/>|' "$f"
          grep -n "INTERNET\|FOREGROUND_SERVICE\|MANAGE_EXTERNAL_STORAGE\|requestLegacyExternalStorage\|APP_MUSIC\|MUSIC_PLAYER" "$f"

      - name: Patch audio service
        run: |
          python3 <<'PYEOF'
          import glob
          matches = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          ma = matches[0] if matches else None
          if ma:
              pk = ma.replace("android/app/src/main/kotlin/", "").replace("/MainActivity.kt", "").replace("/", ".")
              with open(ma, "w") as f:
                  f.write("package " + pk + "\n\nimport android.content.Intent\nimport com.ryanheise.audioservice.AudioService\nimport com.ryanheise.audioservice.AudioServiceActivity\n\nclass MainActivity : AudioServiceActivity() {\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n        super.onCreate(savedInstanceState)\n        // [xmusic] 车机识别：App 启动即拉起 AudioService，MediaSession 常驻活跃，迪友等车机桌面才能枚举到\n        startService(Intent(this, AudioService::class.java))\n    }\n}\n")
              print("Wrote " + ma)
              print(open(ma).read())
          else:
              print("WARNING: MainActivity.kt not found!")
              print(glob.glob("android/app/src/main/**/*.kt", recursive=True))
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if 'xmlns:tools' not in s:
              s = s.replace('<manifest ', '<manifest xmlns:tools="http://schemas.android.com/tools" ', 1)
          if 'AudioService' not in s:
              svc = "\n      <service android:name=\"com.ryanheise.audioservice.AudioService\" android:foregroundServiceType=\"mediaPlayback\" android:exported=\"true\" tools:ignore=\"Instantiatable\">\n        <intent-filter>\n          <action android:name=\"android.media.browse.MediaBrowserService\" />\n        </intent-filter>\n      </service>\n      <receiver android:name=\"com.ryanheise.audioservice.MediaButtonReceiver\" android:exported=\"true\" tools:ignore=\"Instantiatable\">\n        <intent-filter>\n          <action android:name=\"android.intent.action.MEDIA_BUTTON\" />\n        </intent-filter>\n      </receiver>\n  </application>"
              s = s.replace("</application>", svc)
          open(p, "w").write(s)
          print("=== MANIFEST ===")
          print(open(p).read())
          print("=== END ===")
          PYEOF

      - name: Generate app icons
        run: |
          # Drop any adaptive-icon xml from the template so our PNGs are used.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python -m pip install pillow --quiet
          python - <<'EOF'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('assets/app_icon.png').convert('RGBA')
          # Round the corners so the icon looks clean on any launcher.
          mask = Image.new('L', src.size, 0)
          d = ImageDraw.Draw(mask)
          r = int(src.size[0] * 0.22)
          d.rounded_rectangle([0, 0, src.size[0] - 1, src.size[1] - 1],
                              radius=r, fill=255)
          src.putalpha(mask)
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
                   'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for d, s in sizes.items():
              p = os.path.join('android/app/src/main/res', d)
              os.makedirs(p, exist_ok=True)
              img = src.resize((s, s), Image.LANCZOS)
              img.save(os.path.join(p, 'ic_launcher.png'))
              img.save(os.path.join(p, 'ic_launcher_round.png'))
          print('icons generated')
          EOF

      - name: Sync version string
        run: |
          echo "const String appVersion = '0.3.${{ github.run_number }}';" > lib/app_version.dart
          cat lib/app_version.dart

      - name: Transparent window background
        run: |
          python3 <<'PYEOF'
          import glob
          # Find styles.xml and set transparent window background
          for p in glob.glob("android/app/src/main/res/values*/styles.xml"):
              s = open(p).read()
              if 'windowBackground' not in s:
                  s = s.replace('</style>', '<item name="android:windowBackground">@android:color/transparent</item>\n    </style>')
              if 'windowIsTranslucent' not in s:
                  s = s.replace('</style>', '<item name="android:windowIsTranslucent">true</item>\n    </style>')
              open(p, "w").write(s)
              print("Patched " + p)
          # Also create drawable transparent bg
          import os
          os.makedirs("android/app/src/main/res/drawable", exist_ok=True)
          with open("android/app/src/main/res/drawable/transparent_bg.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="@android:color/transparent"/>\n</shape>')
          print("Created transparent_bg.xml")
          PYEOF

      - run: flutter pub get
      - name: Clean stale build caches
        run: |
          # [xmusic] 修复：GitHub 构建环境曾复用旧编译产物（产物版本号停留在旧值）。
          # 强制清空 Dart/Gradle 全部缓存（含 ~/.gradle transforms 等），保证全量编译。
          flutter clean || true
          rm -rf build .dart_tool android/app/build android/.gradle
          rm -rf ~/.gradle 2>/dev/null || true
          echo "clean done"
      - name: Patch audio_service MediaSession always-active
        run: |
          python3 <<'PYEOF'
          import glob, os
          # 车机识别：迪友桌面用 MediaSessionManager.getActiveSessions 枚举音乐应用。
          # audio_service 默认只在播放时才 setActive(true)，服务未播放时车机识别不到。
          # 这里 patch 插件源码：onCreate 创建 MediaSession 后立即 setActive(true)，服务一启动即常驻激活。
          files = glob.glob(os.path.expanduser("~/.pub-cache/hosted/pub.dev/audio_service-*/android/src/main/java/com/ryanheise/audioservice/AudioService.java"))
          print("audio_service files:", files)
          if not files:
              raise SystemExit("AudioService.java not found in pub cache!")
          p = files[0]
          s = open(p).read()
          # [xmusic] 检测 audio_service 用的 MediaSession 兼容库，选对 PlaybackStateCompat 全限定名
          PSC = ("androidx.media.session.PlaybackStateCompat" if "androidx.media.session.PlaybackStateCompat" in s
                 else "android.support.v4.media.session.PlaybackStateCompat")
          anchor = "mediaSession.setQueue(queue);"
          add = anchor + "\n        // [xmusic] 常驻激活：服务启动即 setActive，车机桌面(迪友) getActiveSessions 才能枚举到\n        mediaSession.setActive(true);\n        // [xmusic] 常驻可播放状态：未播放时也呈 PAUSED + 完整控制 actions，\n        // 车机系统/桌面枚举到 active session 后还需可控制的 playbackState 才会展示控制卡片。\n        if (mediaSession.getController().getPlaybackState() == null ||\n            mediaSession.getController().getPlaybackState().getState() == PSC.STATE_NONE) {\n          mediaSession.setPlaybackState(new PSC.Builder()\n              .setActions(PSC.ACTION_PLAY | PSC.ACTION_PAUSE | PSC.ACTION_PLAY_PAUSE |\n                  PSC.ACTION_SKIP_TO_NEXT | PSC.ACTION_SKIP_TO_PREVIOUS)\n              .setState(PSC.STATE_PAUSED, 0, 1.0f)\n              .build());\n        }"
          onCreateSeg = s.split("public void onCreate()")[1].split("public int onStartCommand")[0]
          add = add.replace("PSC", PSC)  # [xmusic] PSC 占位替换为真实 PlaybackStateCompat 全限定名
          if anchor in s and "setActive(true)" not in onCreateSeg:
              s = s.replace(anchor, add, 1)
              open(p, "w").write(s)
              print("PATCHED: onCreate setActive(true)")
          else:
              print("SKIP: anchor=", anchor in s, "already patched=", "setActive(true)" in onCreateSeg)
          seg = open(p).read().split("public void onCreate()")[1].split("public int onStartCommand")[0]
          print("onCreate setActive count:", seg.count("setActive(true)"))
          print("total setActive count:", open(p).read().count("setActive(true)"))
          # [xmusic] 车机识别关键：迪友桌面用 MediaSessionManager.getActiveSessions + state 过滤
          # 未播放时 audio_service 呈 STATE_NONE（idle）会被过滤不显示；改为 PAUSED 即可枚举。
          # 同时保证 setActions 始终含 PLAY_PAUSE/PLAY/PAUSE（方向盘播放暂停可用）。
          s2 = open(p).read()
          s2 = s2.replace("case idle: return PlaybackStateCompat.STATE_NONE;",
                          "case idle: return PlaybackStateCompat.STATE_PAUSED;")
          # setActions 强制并上 PLAY_PAUSE（Dart systemActions 无 playPause 映射，AUTO_ENABLED 有但保险起见）
          s2 = s2.replace(".setActions(AUTO_ENABLED_ACTIONS | actionBits)",
                          ".setActions(AUTO_ENABLED_ACTIONS | actionBits | PlaybackStateCompat.ACTION_PLAY_PAUSE)")
          open(p, "w").write(s2)
          print("idle->PAUSED applied:", "STATE_PAUSED;" in s2.split("case idle:")[1][:60])
          print("PLAY_PAUSE forced:", "ACTION_PLAY_PAUSE)" in s2)
          PYEOF
      - name: Disable release lint fatal
        run: |
          f=android/app/build.gradle
          [ -f "$f" ] || f=android/app/build.gradle.kts
          if [[ "$f" == *.kts ]]; then
            sed -i 's|android {|android {\n  lint { checkReleaseBuilds = false; abortOnError = false }|' "$f"
          else
            sed -i 's|android {|android {\n    lintOptions { checkReleaseBuilds false; abortOnError false }|' "$f"
          fi
          grep -n lint "$f"
      - run: flutter build apk --release --build-number=${{ github.run_number }} --build-name=0.3.${{ github.run_number }}

      - name: Verify APK version freshness
        run: |
          # [xmusic] 防旧产物交付：APK 内必须能找到当前版本串，否则构建失败（不会上传旧包）
          python3 <<'PYEOF'
          import zipfile, re
          p = "build/app/outputs/flutter-apk/app-release.apk"
          z = zipfile.ZipFile(p)
          so = z.read("lib/arm64-v8a/libapp.so")
          vers = set(re.findall(rb"0\.3\.\d+", so))
          expect = b"0.3.${{ github.run_number }}"
          if expect not in vers:
              print("VERSION MISMATCH: expect", expect, "found", sorted(vers))
              raise SystemExit(1)
          print("version ok:", sorted(vers))
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: my-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk