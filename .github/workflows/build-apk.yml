name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name my_stream_player .

      - name: Patch app label and package id
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="音素"|' "$f"
          g=android/app/build.gradle
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId "com.xmusic.player"|' "$g"
          fi
          g=android/app/build.gradle.kts
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId = "com.xmusic.player"|' "$g"
          fi

      - name: Patch AndroidManifest permissions and service
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<manifest|<manifest xmlns:tools="http://schemas.android.com/tools"|' "$f"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<application|' "$f"
          sed -i 's|</application|    <service android:name="com.ryanheise.audioservice.AudioServicePlugin" android:foregroundServiceType="mediaPlayback" android:exported="true" tools:ignore="Instantiatable"><intent-filter><action android:name="android.media.browse.MediaBrowserService" /></intent-filter></service>\n  </application|' "$f"

      - name: Generate app icon
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-mdpi
          convert -size 192x192 xc:"#4A7CF7" -gravity center -font DejaVu-Sans-Bold -pointsize 120 -fill white -annotate 0 "♪" android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          convert -size 144x144 xc:"#4A7CF7" -gravity center -font DejaVu-Sans-Bold -pointsize 90 -fill white -annotate 0 "♪" android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          convert -size 96x96 xc:"#4A7CF7" -gravity center -font DejaVu-Sans-Bold -pointsize 60 -fill white -annotate 0 "♪" android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          convert -size 72x72 xc:"#4A7CF7" -gravity center -font DejaVu-Sans-Bold -pointsize 45 -fill white -annotate 0 "♪" android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          convert -size 48x48 xc:"#4A7CF7" -gravity center -font DejaVu-Sans-Bold -pointsize 30 -fill white -annotate 0 "♪" android/app/src/main/res/mipmap-mdpi/ic_launcher.png

      - name: Disable release lint
        run: |
          g=android/app/build.gradle
          if [ -f "$g" ]; then
            sed -i 's|android {|android {\n    lintOptions {\n        checkReleaseBuilds false\n        abortOnError false\n    }|' "$g"
          fi
          g=android/app/build.gradle.kts
          if [ -f "$g" ]; then
            sed -i 's|android {|android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }|' "$g"
          fi

      - name: Generate version file
        run: echo "const String appVersion = '0.2.${{ github.run_number }}';" > lib/app_version.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
