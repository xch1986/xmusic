name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name my_stream_player .

      - name: Patch app label and package id
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="音素"|' "$f"
          # Newer Flutter templates use build.gradle.kts, older use build.gradle.
          g=android/app/build.gradle
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId "com.xmusic.player"|' "$g"
          fi
          g=android/app/build.gradle.kts
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId = "com.xmusic.player"|' "$g"
          fi
          grep -n "android:label" "$f"
          grep -rn "applicationId" android/app/build.gradle* || true

      - name: Patch AndroidManifest (network)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n    <application android:usesCleartextTraffic="true"|' "$f"
          grep -n "INTERNET\|FOREGROUND_SERVICE" "$f"

      - name: Patch audio service
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|    <service android:name="com.ryanheise.audioservice.AudioServicePlugin" android:foregroundServiceType="mediaPlayback" android:exported="true">\n      <intent-filter>\n        <action android:name="android.media.browse.MediaBrowserService" />\n      </intent-filter>\n    </service>\n  </application>|' "$f"
          grep -n "AudioServicePlugin" "$f"

      - name: Patch intent-filter (music player)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<category android:name="android.intent.category.LAUNCHER" />|<category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n            <intent-filter>\n              <action android:name="android.intent.action.VIEW" />\n              <category android:name="android.intent.category.DEFAULT" />\n              <data android:mimeType="audio/*" />\n              <data android:mimeType="application/ogg" />\n              <data android:mimeType="application/x-ogg" />\n              <data android:mimeType="application/mp4" />\n              <data android:mimeType="application/x-mp3" />' "$f"
          grep -n "audio" "$f"

      - name: Generate app icons
        run: |
          # Drop any adaptive-icon xml from the template so our PNGs are used.
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          python -m pip install pillow --quiet
          python - <<'EOF'
          from PIL import Image, ImageDraw
          import os
          src = Image.open('assets/app_icon.png').convert('RGBA')
          # Round the corners so the icon looks clean on any launcher.
          mask = Image.new('L', src.size, 0)
          d = ImageDraw.Draw(mask)
          r = int(src.size[0] * 0.22)
          d.rounded_rectangle([0, 0, src.size[0] - 1, src.size[1] - 1],
                              radius=r, fill=255)
          src.putalpha(mask)
          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96,
                   'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          for d, s in sizes.items():
              p = os.path.join('android/app/src/main/res', d)
              os.makedirs(p, exist_ok=True)
              img = src.resize((s, s), Image.LANCZOS)
              img.save(os.path.join(p, 'ic_launcher.png'))
              img.save(os.path.join(p, 'ic_launcher_round.png'))
          print('icons generated')
          EOF

      - run: flutter pub get
      - name: Disable release lint fatal
        run: |
          f=android/app/build.gradle
          [ -f "$f" ] || f=android/app/build.gradle.kts
          if [[ "$f" == *.kts ]]; then
            sed -i 's|android {|android {\n  lint { checkReleaseBuilds = false; abortOnError = false }|' "$f"
          else
            sed -i 's|android {|android {\n    lintOptions { checkReleaseBuilds false; abortOnError false }|' "$f"
          fi
          grep -n lint "$f"
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: my-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
