name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name my_stream_player .

      - name: Patch app label and package id
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|android:label="[^"]*"|android:label="音素"|' "$f"
          g=android/app/build.gradle
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId "com.xmusic.player"|' "$g"
          fi
          g=android/app/build.gradle.kts
          if [ -f "$g" ]; then
            sed -i -E 's|applicationId[ =]*"[^"]*"|applicationId = "com.xmusic.player"|' "$g"
          fi

      - name: Patch AndroidManifest permissions and service
        run: |
          f=android/app/src/main/AndroidManifest.xml
          # Add permissions before <application
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<application|' "$f"
          # Add AudioServicePlugin service before </application>
          sed -i 's|</application|    <service android:name="com.ryanheise.audioservice.AudioServicePlugin" android:foregroundServiceType="mediaPlayback" android:exported="true"><intent-filter><action android:name="android.media.browse.MediaBrowserService" /></intent-filter></service>\n  </application|' "$f"
          cat "$f"

      - name: Generate version file
        run: echo "const String appVersion = '0.2.${{ github.run_number }}';" > lib/app_version.dart

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-player-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
